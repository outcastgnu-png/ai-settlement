[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xrpl-escrow"
version = "0.3.0"
description = "Python client SDK for the verified-delivery escrow kit on the XRP Ledger testnet"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["xrpl-py>=4.0,<6", "python-dotenv>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["testnet: needs the XRP Ledger testnet and faucet (run with --testnet)"]
